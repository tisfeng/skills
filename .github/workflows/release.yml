name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  find-main-validation:
    name: Find successful main validation
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      reusable: ${{ steps.find.outputs.reusable }}
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Find validation for this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! run_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/validate.yml/runs?event=push&branch=main&head_sha=${GITHUB_SHA}&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "Validate Skills" and .event == "push" and .head_branch == "main" and .head_sha == env.GITHUB_SHA and .status == "completed" and .conclusion == "success") | {id, updated_at}] | sort_by(.updated_at) | last // empty')"; then
            echo "Unable to query main validation; running full tag validation."
            run_json=""
          fi
          if [[ -n "$run_json" ]]; then
            run_id="$(jq -r '.id' <<<"$run_json")"
            echo "Found successful main validation run $run_id for $GITHUB_SHA."
            echo "reusable=true" >>"$GITHUB_OUTPUT"
            echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
          else
            echo "No successful main validation found for $GITHUB_SHA; running full tag validation."
            echo "reusable=false" >>"$GITHUB_OUTPUT"
            echo "run_id=" >>"$GITHUB_OUTPUT"
          fi

  validate:
    if: needs.find-main-validation.outputs.reusable != 'true'
    needs: find-main-validation
    uses: ./.github/workflows/validate.yml

  release:
    name: Create GitHub Release
    if: ${{ always() && needs.find-main-validation.result == 'success' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    needs:
      - find-main-validation
      - validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify release commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release commit $GITHUB_SHA is not contained in origin/main." >&2
            exit 1
          fi

      - name: Validate release changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              raise SystemExit(f"Unsupported release tag: {tag}; expected vX.Y.Z.")
          path = Path("release/changelog") / f"{tag[1:]}.md"
          if not path.is_file():
              raise SystemExit(f"Missing {path}; commit the changelog before tagging a new version.")
          notes = path.read_text(encoding="utf-8")
          sections = re.split(r"(?m)^##[ \t]+", notes)
          updates = [section for section in sections[1:] if section.partition("\n")[0].strip() == "更新内容"]
          if (not notes.startswith("## 更新内容\n") or len(updates) != 1
                  or not re.search(r"(?m)^- [^\S\n]*\S", updates[0])):
              raise SystemExit(f"Invalid {path}; start with '## 更新内容' and include a nonempty bullet.")
          comparison = re.compile(
              r"\*\*Full Changelog\*\*: https://github\.com/"
              + re.escape(os.environ["GITHUB_REPOSITORY"])
              + r"/compare/v[0-9]+\.[0-9]+\.[0-9]+\.\.\." + re.escape(tag)
          )
          if not comparison.fullmatch(notes.rstrip().splitlines()[-1]):
              raise SystemExit(f"Invalid {path}; end with a Full Changelog link to {tag}.")
          print(f"Validated {path}")
          PY

      - name: Create and verify release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_file="release/changelog/${RELEASE_TAG#v}.md"
          release_dir="$(mktemp -d)"
          trap 'rm -rf "$release_dir"' EXIT
          # A failed query must not be interpreted as an absent release.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].tag_name' >"$release_dir/tags"
          if ! grep -Fxq "$RELEASE_TAG" "$release_dir/tags"; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file "$notes_file"
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,body >"$release_dir/release.json"
          if ! jq -e --arg tag "$RELEASE_TAG" --rawfile notes "$notes_file" '
            def normalize: gsub("\r\n"; "\n") | sub("\n+$"; "");
            .tagName == $tag and .name == $tag and
            ((.body | normalize) == ($notes | normalize))
          ' "$release_dir/release.json" >/dev/null; then
            echo "Release $RELEASE_TAG does not match $notes_file; explicitly authorize a repair before updating the release." >&2
            exit 1
          fi
          echo "Verified release $RELEASE_TAG against $notes_file."
