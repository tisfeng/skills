name: Publish npm Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node --print "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version." >&2
            exit 1
          fi

      - name: Verify release changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          changelog_path="docs/release/changelog/$release_version.md"
          if [[ ! -s "$changelog_path" ]]; then
            echo "Release changelog $changelog_path is missing or empty." >&2
            exit 1
          fi

      - name: Verify release commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release commit $GITHUB_SHA is not contained in origin/main." >&2
            exit 1
          fi

      - name: Validate skill structure
        run: python3 scripts/validate-skills.py

      - name: Compile Python files
        run: python3 -m compileall -q skills scripts

      - name: Validate Codex agents
        run: python3 scripts/validate-agents.py

      - name: Test agent installer
        run: node --test tests/agents-installer.test.mjs

      - name: Test git-commit
        run: python3 -m unittest discover -s skills/git-commit/tests -p 'test_*.py'

      - name: Test review-pr
        run: python3 -m unittest discover -s skills/review-pr/tests -p 'test_*.py'

      - name: Test submit-pr
        run: python3 -m unittest discover -s skills/submit-pr/tests -p 'test_*.py'

      - name: Check shell syntax
        run: bash -n skills/review-pr/scripts/prepare-pr-branch.sh

      - name: Inspect package contents
        run: npm pack --dry-run

  publish:
    name: Publish @tisfeng/codex-agents
    needs: validate
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish package
        run: npm publish --access public

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists."
          else
            release_notes="docs/release/changelog/${RELEASE_TAG#v}.md"
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --notes-file "$release_notes" \
              --title "Skills $RELEASE_TAG"
          fi
